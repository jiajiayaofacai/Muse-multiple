<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Muse-multiple 本地交互原型，不连接真实账号。">
  <title>Muse-multiple · 界面原型</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <svg class="svg-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5H4l-2 2v-9.5A9.5 9.5 0 1 1 21 11.5Z"/><path d="M7 10h10M7 14h6"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="m9 3-.5 3-2 1L4 6 2 10l2.5 2v2L2 16l2 4 2.5-1 2 1 .5 3h5l.5-3 2-1 2.5 1 2-4-2.5-2v-2l2.5-2-2-4-2.5 1-2-1-.5-3Z" transform="translate(0 -1) scale(1 .96)"/><circle cx="11.5" cy="12" r="3"/></symbol>
    <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16m7-11-3 3 3 3"/></symbol>
    <symbol id="i-terminal" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="m7 9 3 3-3 3m6 0h4"/></symbol>
    <symbol id="i-dashboard" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="11" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="18" width="7" height="3" rx="1"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 5v16M3 4c4-1 7-1 9 1 2-2 5-2 9-1v15c-4-1-7-1-9 1-2-2-5-2-9-1Z"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 3h7v7m0-7-11 11m0-10H5a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h13a2 2 0 0 0 2-2v-5"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5m-4-4a8 8 0 0 1 13-3l2 3M4 16l2 3a8 8 0 0 0 13-3"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 4v3"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14a8 8 0 0 1-10-10 9 9 0 1 0 10 10Z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v.5"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6Z"/><path d="m8 12 3 3 5-6"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="m12 2 2.8 7.2L22 12l-7.2 2.8L12 22l-2.8-7.2L2 12l7.2-2.8Z"/></symbol>
  </svg>
  <div id="app" class="app-shell">
    <header class="topbar">
      <button class="brand" data-action="home" aria-label="Muse-multiple 首页">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 28 28"><path d="M5 21V9a3 3 0 0 1 5.5-1.7L14 13l3.5-5.7A3 3 0 0 1 23 9v12M10 21v-7l4 6 4-6v7"/></svg></span>
        <span>Muse<span class="brand-light">-multiple</span></span>
      </button>
      <span class="prototype-badge">交互原型</span>
      <nav class="top-actions" aria-label="工作台工具">
        <button id="dashboard-link" class="top-link" data-action="dashboard"><svg class="icon"><use href="#i-dashboard"/></svg><span>仪表盘</span></button>
        <button id="console-toggle" class="top-link" data-action="console" aria-expanded="false" aria-controls="console"><svg class="icon"><use href="#i-terminal"/></svg><span>控制台</span></button>
        <span class="top-divider"></span>
        <button class="top-link" data-action="docs"><svg class="icon"><use href="#i-book"/></svg><span>使用文档</span></button>
        <a class="top-link" href="https://github.com/jiajiayaofacai/Muse-multiple" target="_blank" rel="noopener noreferrer" aria-label="在浏览器打开 GitHub 项目页面"><span>GitHub</span><svg class="icon small"><use href="#i-external"/></svg></a>
      </nav>
    </header>
    <aside id="sidebar" class="sidebar" aria-label="主导航"></aside>
    <main class="workspace">
      <section id="view" class="view" aria-label="工作区"></section>
      <section id="console" class="console" aria-label="工作台控制台" hidden></section>
    </main>
  </div>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <div id="account-menu" class="account-menu" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <noscript>此交互原型需要启用 JavaScript。它不连接真实 Muse 账号。</noscript>
</body>
</html>
