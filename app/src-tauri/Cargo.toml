[package]
name = "muse-multiple"
version = "0.1.0"
edition = "2024"
description = "Muse-multiple Windows desktop M0 verification"

[lib]
name = "muse_multiple_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = ["unstable", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

# Narrow, licensed fixed-version patches for Windows same-host child adoption.
[patch.crates-io]
tauri = { path = "vendor/tauri-2.11.5" }
tauri-runtime = { path = "vendor/tauri-runtime-2.11.3" }
tauri-runtime-wry = { path = "vendor/tauri-runtime-wry-2.11.4" }
wry = { path = "vendor/wry-0.55.1" }
